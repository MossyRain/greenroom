</style></head><body><div class="app"><div id="jungle" class="page jungle"><div class="world" id="world"></div><div id="editHUD" class="edit-hud hidden"></div></div><div id="main" class="page hidden"></div><div class="bottom"><button id="wander" class="wander" aria-label="植物を探す">wander</button><div id="wanderPanel" class="wander-panel hidden"><div id="wanderWheel" class="wander-wheel"></div></div><div class="nav" id="nav"></div><div class="brand"><button type="button" id="brandHome" aria-label="jungleの初期位置に戻る"><img src="greenroom-logo.png" alt="greenroom"></button><span>v0.5</span></div></div><div id="overlay" class="overlay hidden"><div class="sheet" id="sheet"></div></div></div><script>
(()=>{'use strict';const KEY='greenroom-jungle-v1',OLD='greenroom-plants-v1';let plants=[],records=[],page='jungle',layout=false,pan=0,drag=null,urls=new Map(),db=null,editingId=null,editOriginal=null,overview=false,pinching=null,longTimer=null,skipTap=false,pressPoint=null;const THEMEKEY='greenroom-theme-v2',DEF={bg:'#E8E8E8',ink:'#242824',muted:'#727872',line:'#C9CCCA',light:['#F5F5F5','#D8D8D8','#B4B4B4','#888888','#555555'],water:['#C8B7A3','#AE9780','#6F5A49','#5D625E','#4E5D61']};let theme=JSON.parse(JSON.stringify(DEF));try{let c=JSON.parse(localStorage.getItem(THEMEKEY));if(c)theme={...theme,...c}}catch{}const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID?.()||Date.now()+'-'+Math.random(),date=()=>new Date().toLocaleDateString('sv-SE'),pos=(n)=>Math.round(Number(n)||0);function applyTheme(){let st=document.documentElement.style;for(let [k,v] of Object.entries({bg:theme.bg,ink:theme.ink,muted:theme.muted,line:theme.line}))st.setProperty('--'+k,v);document.querySelector('meta[name="theme-color"]').content=theme.bg}function saveTheme(){localStorage.setItem(THEMEKEY,JSON.stringify(theme));applyTheme()}function lightIndex(p){let n=Number(p.lightLevel);if(n>=1&&n<=5)return n;let s=String(p.light||'');return /日陰|弱光/.test(s)?1:/半日陰|間接/.test(s)?2:/明るい/.test(s)?3:/日向|直射/.test(s)?5:3}function waterIndex(p){let n=Number(p.waterLevel);return n>=1&&n<=5?n:3}function miniInfo(p){return `<div class="mini-info" data-info="${esc(p.id)}" title="長押しで説明"><i style="background:${theme.light[lightIndex(p)-1]}"></i><i style="background:${theme.water[waterIndex(p)-1]}"></i><span class="months">${esc(p.repotSeason||'—')}</span><span class="place">${esc(p.location||'—')}</span></div>`}function infoSheet(id){let p=plants.find(x=>x.id===id);if(!p)return;sheet(`<div class="sheethead"><h2>表示の意味</h2><button data-close class="close">×</button></div><div class="meta"><span>light</span><span><i class="infosq" style="background:${theme.light[lightIndex(p)-1]}"></i> 必要光量 ${lightIndex(p)} / 5<br>${esc(p.light||'未設定')}</span></div><div class="meta"><span>water</span><span><i class="infosq" style="background:${theme.water[waterIndex(p)-1]}"></i> 乾燥寄り 01 — 05 湿潤寄り<br>好み ${waterIndex(p)} / 5</span></div><div class="meta"><span>repot</span><span>${esc(p.repotSeason||'未設定')}　植え替えの適期（月）</span></div><div class="meta"><span>location</span><span>${esc(p.location||'未設定')}</span></div>`)}function persist(){localStorage.setItem(KEY,JSON.stringify({plants,records}));}function openDB(){return new Promise((ok,no)=>{if(!indexedDB){no(Error('IndexedDB unavailable'));return}let req=indexedDB.open('greenroom-images-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('images');req.onsuccess=()=>ok(req.result);req.onerror=()=>no(req.error)})}function imagePut(key,blob){return new Promise((ok,no)=>{let tx=db.transaction('images','readwrite');tx.objectStore('images').put(blob,key);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})}function imageGet(key){return new Promise((ok,no)=>{let tx=db.transaction('images','readonly');let q=tx.objectStore('images').get(key);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}function imageDelete(key){return new Promise((ok,no)=>{let tx=db.transaction('images','readwrite');tx.objectStore('images').delete(key);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})}async function getURL(p,type){let key=p.id+':'+type;if(urls.has(key))return urls.get(key);let blob=await imageGet(key);if(!blob)return '';let u=URL.createObjectURL(blob);urls.set(key,u);return u}function clearURL(key){let u=urls.get(key);if(u)URL.revokeObjectURL(u);urls.delete(key)}async function renderImages(){let nodes=document.querySelectorAll('img[data-img]');await Promise.all([...nodes].map(async img=>{let [id,type]=img.dataset.img.split(':');let p=plants.find(p=>p.id===id);if(!p)return;let src=await getURL(p,type);if(!img.isConnected)return;if(src)img.src=src;else if(type==='pot'){let j=await getURL(p,'jungle');if(j)img.src=j;else img.replaceWith(ghost())}else img.replaceWith(ghost())}))}function ghost(){let g=document.createElement('div');g.className='ghost';g.textContent='✳';return g}function picture(p,type,cls=''){return `<img class="${cls}" data-img="${esc(p.id)}:${type}" alt="${esc(p.name)}" draggable="false">`}
function assign(p,side){let others=plants.filter(a=>a!==p),min=Math.min(0,...others.map(x=>x.x??0)),max=Math.max(0,...others.map(x=>x.x??0));p.x=others.length?(side==='left'?min-110:max+110):0;p.layer=p.layer??(1+Math.floor(Math.random()*5));p.y=p.y??([-3,22,49,74,92][p.layer-1]);p.w=p.w||190;p.h=p.h||260}function load(){try{let saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.plants)){plants=saved.plants;records=Array.isArray(saved.records)?saved.records:[];return}}catch{}try{let old=JSON.parse(localStorage.getItem(OLD));if(Array.isArray(old)){plants=old.map((p,i)=>({id:p.id||uid(),name:p.name||'植物',species:p.species||'',location:p.location||'',light:p.light||'',waterDays:p.waterDays||7,waterMethod:p.waterMethod||'',lastWater:p.lastWater||'',lastRepot:p.lastRepot||'',repotSeason:p.repotSeason||'',notes:p.notes||'',layer:1+i%5,x:(i%2?1:-1)*Math.ceil(i/2)*110,y:[-3,22,49,74,92][i%5],w:190,h:260,legacyPhoto:p.photo||'',log:p.log||[]}));records=plants.flatMap(p=>(p.log||[]).map(l=>({id:uid(),plantId:p.id,type:l.type,date:l.date})));persist();return}}catch{}plants=[];records=[];persist()}
function editZoom(){if(!layout||!overview)return 1;let p=plants.find(a=>a.id===editingId);if(!p)return 1;let j=$('#jungle'),h=j.clientHeight,w=j.clientWidth;return Math.min(.9,(h*.70)/Math.max(1,p.h),(w*.82)/Math.max(1,p.w))}function sorted(){return [...plants].sort((a,b)=>(a.layer||3)-(b.layer||3)||a.x-b.x)}let viewportW=0;function renderJungle(){let world=$('#world');viewportW=$('#jungle').clientWidth;world.innerHTML='';const viewHeight=$('#jungle').clientHeight,base=Math.max(140,viewHeight-105);for(let p of sorted()){let zoom=editZoom();let x=viewportW/2+(p.x+pan)*zoom,w=(p.w||190)*zoom,h=(p.h||260)*zoom;if(x+w/2 < -120 || x-w/2>viewportW+120)continue;let sprite=document.createElement('button');sprite.className='sprite';sprite.dataset.id=p.id;sprite.setAttribute('aria-label',p.name);sprite.style.cssText=`left:${Math.round(x-w/2)}px;top:${Math.round(base-h+(p.y||0)*zoom)}px;width:${w}px;height:${h}px;z-index:${p.layer||3}`;sprite.innerHTML=picture(p,'jungle');if(layout&&p.id===editingId)sprite.classList.add('selected-sprite');world.append(sprite)}renderImages();}

function renderMy(){let m=$('#main');m.innerHTML=`<div class="content"><div class="eyebrow">YOUR LIVING PLANTS</div><h1>My Plants <span class="muted">${plants.length}</span></h1><input id="q" class="search" placeholder="植物名・品種・場所で探す" aria-label="植物検索"><div class="filterrow" id="filters"><button class="chip active" data-filter="all">すべて</button><button class="chip" data-filter="water">土の確認</button><button class="chip" data-filter="repot">植え替え</button></div><div class="gallery" id="gallery"></div></div>`;let filter='all';function list(){let q=$('#q').value.toLowerCase();let found=plants.filter(p=>(p.name+' '+p.species+' '+p.location).toLowerCase().includes(q)&&(filter==='all'||filter==='water'&&dueWater(p)||filter==='repot'&&dueRepot(p)));$('#gallery').innerHTML=found.map(p=>`<button class="tile" data-detail="${esc(p.id)}"><div class="tileart">${picture(p,'pot')}</div><div class="tile-name">${esc(p.name)}</div>${miniInfo(p)}</button>`).join('')||'<div class="empty">植物が見つかりません</div>';renderImages()}$('#q').oninput=list;$('#filters').onclick=e=>{let b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;$('#filters').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));list()};list()}

function care(id){let p=plants.find(p=>p.id===id);if(!p)return;sheet(`<div class="sheethead"><h2>${esc(p.name)}</h2><button class="close" data-close>×</button></div><p class="muted">実施した内容のみ記録してください。</p><form id="careForm"><div class="field"><label>お世話の種類</label><select name="type"><option value="water">水やり</option><option value="check">土の確認（水やりなし）</option><option value="repot">植え替え</option><option value="fertilize">施肥</option></select></div><div class="field"><label>実施日</label><input name="date" type="date" required value="${date()}"></div><div class="field"><label>メモ（任意）</label><textarea name="memo" rows="2"></textarea></div><button class="solid">記録する</button></form>`);$('#careForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),type=f.get('type'),dt=f.get('date');records.push({id:uid(),plantId:id,type,date:dt,memo:f.get('memo')});if(type==='water')p.lastWater=dt;if(type==='repot')p.lastRepot=dt;persist();close();render()}}
function form(id){let p=plants.find(p=>p.id===id),editing=!!p;p=p||{name:'',species:'',location:'',light:'',waterDays:7,waterMethod:'',repotSeason:'',lastWater:'',lastRepot:'',notes:'',layer:3,w:190,h:260};sheet(`<div class="sheethead"><h2>${editing?'植物の編集':'植物を登録'}</h2><button class="close" data-close>×</button></div><form id="plantForm"><div class="field"><label>植物の名前</label><input name="name" required maxlength="100" value="${esc(p.name)}"></div><div class="field"><label>品種・学名</label><input name="species" value="${esc(p.species)}"></div><div class="field"><label>置き場所</label><input name="location" value="${esc(p.location)}"></div><div class="field"><label>JUNGLEイラスト（鉢なし／透過PNG・WebP推奨）</label><input name="jungle" type="file" accept="image/png,image/webp,image/jpeg"></div><div class="field"><label>MY PLANTS・DETAIL（鉢あり）</label><input name="pot" type="file" accept="image/png,image/webp,image/jpeg"></div><div class="field"><label>日照条件</label><input name="light" value="${esc(p.light)}" placeholder="明るい間接光"></div><div class="field"><label>light　明るさの段階（01–05）</label><select name="lightLevel">${[1,2,3,4,5].map(n=>`<option value="${n}" ${lightIndex(p)===n?'selected':''}>${String(n).padStart(2,'0')}</option>`).join('')}</select></div><div class="field"><label>water　好み（01 乾燥 — 05 湿潤）</label><select name="waterLevel">${[1,2,3,4,5].map(n=>`<option value="${n}" ${waterIndex(p)===n?'selected':''}>${String(n).padStart(2,'0')}</option>`).join('')}</select></div><div class="field"><label>土の確認間隔（日）</label><input name="waterDays" type="number" min="1" max="365" value="${Number(p.waterDays)||7}"></div><div class="field"><label>水やり方法</label><textarea name="waterMethod" rows="2">${esc(p.waterMethod)}</textarea></div><div class="field"><label>植え替え適期（例 05–09）</label><input name="repotSeason" value="${esc(p.repotSeason)}"></div><div class="field"><label>特徴・育成条件・注意事項</label><textarea name="notes" rows="5">${esc(p.notes)}</textarea></div><div class="form-actions"><button class="solid">${editin function refreshWander(){let w=$('#wanderWheel');if(!w)return;w.innerHTML='<div class="wheel-pad"></div>'+plants.map(p=>`<button class="wheel-item" data-wplant="${esc(p.id)}">${esc(p.name)}</button>`).join('')+'<div class="wheel-pad"></div>';if(!plants.length)w.innerHTML='<div class="wheel-pad"></div><p class="muted">植物は未登録です</p>';w.onscroll=()=>{let center=w.scrollTop+w.clientHeight/2;w.querySelectorAll('.wheel-item').forEach(b=>{let y=b.offsetTop+b.offsetHeight/2;let d=Math.abs(y-center);b.style.opacity=String(Math.max(.06,1-d/112));b.classList.toggle('wheel-current',d<23)})};w.onscroll()}function showWander(){let p=$('#wanderPanel'),button=$('#wander'),bottom=$('.bottom'),br=button.getBoundingClientRect(),ar=bottom.getBoundingClientRect();p.style.top=(br.top-ar.top+br.height/2-62.5)+'px';p.classList.remove('hidden');button.classList.add('hidden');let w=$('#wanderWheel');requestAnimationFrame(()=>{let first=w.querySelector('.wheel-item');if(first)w.scrollTop=first.offsetTop+first.offsetHeight/2-w.clientHeight/2;w.onscroll()})}function hideWander(){ $('#wanderPanel').classList.add('hidden');$('#wander').classList.toggle('hidden',page!=='jungle')}function focus(id){let p=plants.find(p=>p.id===id);if(!p)return;setPage('jungle');pan=-p.x;renderJungle();let node=[...document.querySelectorAll('.sprite')].find(n=>n.dataset.id===id);if(node){node.style.filter='brightness(1.12)';setTimeout(()=>{if(node.isConnected)node.style.filter=''},900)}}
function pickCandidates(x,y){let j=$('#jungle'),r=j.getBoundingClientRect();let localX=x-r.left,localY=y-r.top;let base=Math.max(140,j.clientHeight-105);return sorted().filter(p=>{let sx=viewportW/2+p.x+pan-(p.w||190)/2,sy=base-(p.h||260)+(p.y||0);return localX>=sx&&localX<=sx+(p.w||190)&&localY>=sy&&localY<=sy+(p.h||260)}).reverse()}function choose(candidates){if(!candidates.length)return;sheet(`<div class="sheethead"><h2>植物を選ぶ</h2><button class="close" data-close>×</button></div>${candidates.map(p=>`<button class="candidate" data-pick="${esc(p.id)}">${picture(p,'pot')}<span>${esc(p.name)}<small>${esc(p.location||'')}</small></span></button>`).join('')}`)}function pickAction(id){let p=plants.find(x=>x.id===id);if(!p)return;sheet(`<div class="sheethead"><h2>${esc(p.name)}</h2><button class="close" data-close>×</button></div><div class="actions"><button class="solid" data-detail="${esc(id)}">詳細</button><button class="outline" data-position="${esc(id)}">配置</button></div>`)}function startPosition(id){let p=plants.find(x=>x.id===id);if(!p)return;editingId=id;editOriginal={x:p.x,y:p.y,w:p.w,h:p.h,layer:p.layer,pan};layout=true;overview=false;close();pan=-p.x;$('#jungle').classList.add('editing');renderJungle();updateHUD()}function updateHUD(){let p=plants.find(x=>x.id===editingId),h=$('#editHUD');if(!p)return;h.classList.remove('hidden');$('#jungle').classList.toggle('overview-mode',overview);h.innerHTML=`<div class="editbox"><div class="editline"><button data-editcmd="cancel">cancel</button><span>position</span><button data-editcmd="done">done</button></div><div class="editline"><span>layer</span><div>${[1,2,3,4,5].map(n=>`<button class="layerbtn ${p.layer===n?'on':''}" data-layer="${n}">${n}</button>`).join('')}</div></div><div class="editline"><button data-editcmd="overview">${overview?'actual size':'fit plant'}</button><span>size</span><input aria-label="size" type="range" min="40" max="900" value="${p.w}" id="sizeRange"></div></div>`;h.querySelector('#sizeRange').on function download(name,blob){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}async function backupSheet(){sheet(`<div class="sheethead"><h2>バックアップ</h2><button class="close" data-close>×</button></div><p class="muted">植物データ・記録・登録画像を1つのJSONファイルに書き出します。容量が大きくなる場合があります。</p><div class="actions"><button class="solid" id="export">バックアップを書き出す</button><button class="outline" id="import">バックアップを読み込む</button><input id="importFile" type="file" accept="application/json" class="hidden"></div>`);$('#export').onclick=async()=>{try{let out={app:'GREENROOM-JUNGLE',version:1,plants,records,images:{}};for(let p of plants)for(let typ of ['jungle','pot']){let blob=await imageGet(p.id+':'+typ);if(blob){let data=await new Promise(ok=>{let reader=new FileReader();reader.onload=()=>ok(reader.result);reader.readAsDataURL(blob)});out.images[p.id+':'+typ]=data}}download('greenroom-jungle-backup-'+date()+'.json',new Blob([JSON.stringify(out)],{type:'application/json'}))}catch(e){alert('書き出しに失敗しました: '+e.message)}};$('#import').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{let json=JSON.parse(await e.target.files[0].text());if(json.app!=='GREENROOM-JUNGLE'||!Array.isArray(json.plants)||json.plants.length>1000||!Array.isArray(json.records)||typeof json.images!=='object'||!json.plants.every(p=>p&&typeof p.id==='string'&&typeof p.name==='string'))throw Error('形式が違います');if(!confirm('現在の全データを置き換えますか？'))return;for(let p of plants)for(let typ of ['jungle','pot']){await imageDelete(p.id+':'+typ);clearURL(p.id+':'+typ)}for(let [k,v] of Object.entries(json.images)){if(!/^.+:(jungle|pot)$/.test(k)||typeof v!=='string'||!v.startsWith('data:image/'))continue;let b=await(await fetch(v)).blob();await imagePut(k,b)}plants=json.plants;records=json.records;persist();close();render()}catch(err){alert('読み込みに失敗しました: '+err.message)}}}
function renderSettings(){$('#main').innerHTML=`<div class="content"><h1>settings</h1><div class="settings-row" data-settings="colors">colors <span>›</span></div><div class="settings-row" data-settings="data">data <span>›</span></div><div class="settings-row" data-settings="about">about <span>›</span></div></div>`}function colorEditor(){sheet(`<div class="sheethead"><h2>colors</h2><button class="close" data-close>×</button></div><p class="muted">色を選んで調整し、実際の情報行で確認できます。saveまで設定は保存されません。</p><div id="colorRows"></div><div class="actions"><button class="solid" id="saveColors">save</button><button class="outline" id="resetColors">reset all</button><button class="outline" id="exportPalette">export palette</button><button class="outline" id="importPalette">import palette</button><input type="file" id="paletteFile" class="hidden" accept="application/json"></div>`);let work=JSON.parse(JSON.stringify(theme));function draw(){let groups=[['light',work.light],['water',work.water],['interface',['bg','ink','muted','line'].map(k=>work[k])]];$('#colorRows').innerHTML=groups.map(([key,arr])=>`<h2>${key}</h2><div class="color-grid">${arr.map((c,i)=>`<label class="color-slot"><input type="color" data-palette="${key}" data-ci="${i}" value="${c}"><span>${key==='interface'?['bg','ink','muted','line'][i]:String(i+1).padStart(2,'0')}</span><code>${c}</code></label>`).join('')}</div>`).join('')+`<h2>preview</h2><div class="preview" style="background:${work.bg};color:${work.ink}"><div>アグラオネマ</div><div class="mini-info"><i style="background:${work.light[1]}"></i><i style="background:${work.water[2]}"></i><span>05–09</span><span class="place" style="color:${work.muted}">リビング・窓際</span></div></div>`;$('#colorRows').querySelectorAll('input[type=color]').forEach(input=>{input.onchange=e=>{let key=e.target.dataset.palette,i=Number(e.target.dataset.ci),v=e.target.value;if(key==='interface')work[['bg','ink','muted','line'][i]]=v;else work[key][i]=v;draw()}})}draw();$('#saveColors').onclick=()=>{theme=work;saveTheme();close();render()};$('#resetColors').onclick=()=>{work=JSON.parse(JSON.stringify(DEF));draw()};$('#exportPalette').onclick=()=>download('greenroom-palette.json',new Blob([JSON.stringify(work,null,2)],{type:'application/json'}));$('#importPalette').onclick=()=>$('#paletteFile').click();$('#paletteFile').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!['bg','ink','muted','line'].every(k=>/^#[0-9a-f]{6}$/i.test(v[k]))||!['light','water'].every(k=>Array.isArray(v[k])&&v[k].length===5&&v[k].every(x=>/^#[0-9a-f]{6}$/i.test(x))))throw Error('形式不正');work=v;draw()}catch(e){alert('パレットの読み込みに失敗: '+e.message)}}}function onLongJungle(e){if(layout)return;skipTap=true;let r=$('#jungle').getBoundingClientRect();pressPoint={x:Math.round(e.clientX-r.left-r.width/2-pan)};sheet(`<div class="sheethead"><h2>植物を選ぶ</h2><button class="close" data-close>×</button></div><button class="candidate" data-newplant>＋ 植物を追加</button>${plants.map(p=>`<button class="candidate" data-pick="${esc(p.id)}">${esc(p.name)}</button>`).join('')}`)}$('#brandHome').onclick=()=>{if(layout)finishEdit(false);hideWander();pan=0;setPage('jungle');pan=0;renderJungle()};$('#nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)};$('#wander').onclick=showWander;$('#wanderWheel').onclick=e=>{let b=e.target.closest('[data-wplant]');if(!b||!b.classList.contains('wheel-current'))return;let id=b.dataset.wplant;hideWander();focus(id)};$('#jungle').addEventListener('click',e=>{if(!$('#wanderPanel').classList.contains('hidden'))hideWander()});document.addEventListener('pointerdown',e=>{if(!$('#wanderPanel').classList.contains('hidden')&&!e.target.closest('#wanderPanel,#wander'))hideWander()});$('#editHUD').onclick=e=>{let l=e.target.closest('[data-layer]');if(l){let p=plants.find(x=>x.id===editingId);if(p){p.layer=Number(l.dataset.layer);renderJungle();updateHUD()}return}let c=e.target.closest('[data-editcmd]');if(!c)return;let a=c.dataset.editcmd;if(a==='done')finishEdit(true);if(a==='cancel')finishEdit(false);if(a==='overview'){overview=!overview;renderJungle();updateHUD()}};$('#overlay').onclick=e=>{if(e.target===$('#overlay'))close();let a=e.target.closest('[data-close],[data-detail],[data-care],[data-edit],[data-find],[data-pick],[data-position],[data-newplant]');if(!a)return;if(a.hasAttribute('data-close'))close();else if(a.hasAttribute('data-newplant'))form();else if(a.dataset.pick)pickAction(a.dataset.pick);else if(a.dataset.position)startPosition(a.dataset.position);else if(a.dataset.detail)detail(a.dataset.detail);else if(a.dataset.care)care(a.dataset.care);else if(a.dataset.edit)form(a.dataset.edit);else if(a.dataset.find){close();focus(a.dataset.find)}};let infoTimer=null,infoTriggered=false;$('#main').addEventListener('pointerdown',e=>{let a=e.target.closest('[data-info]');if(!a)return;infoTriggered=false;infoTimer=setTimeout(()=>{infoTriggered=true;infoSheet(a.dataset.info)},520)});for(let ev of ['pointerup','pointercancel','pointermove'])$('#main').addEventListener(ev,e=>{if(ev==='pointermove'&&infoTimer){return}clearTimeout(infoTimer)});$('#main').onclick=e=>{if(infoTriggered){infoTriggered=false;return}let s=e.target.closest('[data-settings]');if(s){if(s.dataset.settings==='colors')colorEditor();else if(s.dataset.settings==='data')backupSheet();else sheet(`<div class="sheethead"><h2>about</h2><button data-close class="close">×</button></div><p>greenroom v0.5</p><p class="muted">データと画像はこの端末のSafariに保存されます。</p>`);return}let a=e.target.closest('[data-detail],[data-care]');if(!a)return;if(a.dataset.detail)detail(a.dataset.detail);if(a.dataset.care)care(a.dataset.care)};
const touches=new Map();let touchStart=0,velocity=0,lastPanX=0,lastPanTime=0,momentum=null;

function glide(){let v=velocity*16;function tick(){if(layout||page!=='jungle')return;v*=.90;if(Math.abs(v)<.4)return;pan+=v;renderJungle();momentum=requestAnimationFrame(tick)}if(Math.abs(v)>1.5)momentum=requestAnimationFrame(tick)}
$('#jungle').addEventListener('pointerdown',e=>{if(e.button!==0)return;if(!layout&&e.clientY>$('#jungle').getBoundingClientRect().bottom-143)return;stopMomentum();let j=$('#jungle');j.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});clearTimeout(longTimer);
if(layout){let p=plants.find(a=>a.id===editingId);if(!p)return;if(touches.size>1){drag=null;return}
drag={id:editingId,x:e.clientX,y:e.clientY,startX:p.x,startY:p.y,moved:false};return}
drag={id:null,x:e.clientX,y:e.clientY,startPan:pan,moved:false};velocity=0;lastPanX=e.clientX;lastPanTime=performance.now();let x=e.clientX,y=e.clientY;
longTimer=setTimeout(()=>{if(drag&&!drag.moved&&touches.size===1){onLongJungle({clientX:x,clientY:y});drag=null;skipTap=true}},580);
});
$('#jungle').addEventListener('pointermove',e=>{let t=touches.get(e.pointerId);if(!t)return;t.x=e.clientX;t.y=e.clientY;
if(layout&&touches.size>1)return;
if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>7){drag.moved=true;clearTimeout(longTimer)}
if(layout&&drag.id){let p=plants.find(a=>a.id===editingId);if(p){let z=editZoom();p.x=Math.round(drag.startX+dx/z);p.y=Math.round(drag.startY+dy/z);renderJungle()}}
else if(!layout){pan=drag.startPan+dx;panMove(e);renderJungle()}
});
function pointerEnd(e){if(!touches.has(e.pointerId))return;touches.delete(e.pointerId);clearTimeout(longTimer);try{$('#jungle').releasePointerCapture(e.pointerId)}catch{}
if(touches.size<2)pinching=null;let old=drag;drag=null;if(layout)return;if(skipTap){skipTap=false;return}if(!old)return;
if(old.moved){glide();return}let found=pickCandidates(e.clientX,e.clientY);choose(found)}
