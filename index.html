<div id="editBack" class="sheet-back"><div class="sheet" role="dialog" aria-modal="true"><h2 id="formTitle">植物を登録</h2><p class="hint">種類の目安をもとに、鉢ごとの環境や世話の方法を調整できます。</p><form id="plantForm"><div class="form-grid"><div class="field full"><label for="species">植物の種類</label><select id="species"></select></div><div class="field full"><label for="name">植物の名前</label><input id="name" required maxlength="60"></div><div class="field full"><label for="location">置き場所</label><input id="location" maxlength="60" placeholder="リビング・窓から1.5m"></div><div class="field"><label for="light">必要な日照</label><select id="light"><option value="bright">明るい間接光</option><option value="medium">半日陰</option><option value="shade">耐陰性あり</option><option value="direct">直射日光</option></select></div><div class="field"><label for="direction">光・窓・ライト</label><input id="direction" maxlength="100" placeholder="南向き窓から1m"></div><div class="field"><label for="waterDays">土を確認する間隔（日）</label><input id="waterDays" type="number" min="1" max="365" required></div><div class="field"><label for="lastWater">前回の水やり</label><input id="lastWater" type="date"></div><div class="field full"><label for="waterMethod">水やりの方法</label><select id="waterMethod"><option value="dryTop">表土が乾いたらたっぷり</option><option value="dryDeep">鉢の中まで乾いてから</option><option value="slightlyMoist">やや湿り気を保つ</option><option value="dryCompletely">完全に乾いてから</option><option value="custom">メモ参照</option></select></div><div class="field"><label for="repotMonths">植え替え確認間隔（月）</label><input id="repotMonths" type="number" min="1" max="120" required></div><div class="field"><label for="lastRepot">前回の植え替え</label><input id="lastRepot" type="date"></div><div class="field full"><label for="repotSeason">植え替え推奨時期</label><input id="repotSeason" maxlength="60"></div><div class="field full"><label for="photo">植物の写真</label><input type="file" id="photo" accept="image/*"><button type="button" class="outline" id="removePhoto">写真を外す</button></div><div class="field full"><label for="notes">用土・肥 <div id="settingsBack" class="sheet-back"><div class="sheet" role="dialog" aria-modal="true"><h2>データ管理</h2><p class="hint">記録はこのSafari内に保存されます。GitHub Pagesは端末間のデータを同期しません。定期的なバックアップをおすすめします。</p><div class="buttons"><button class="solid" id="exportBtn">JSONを書き出す</button><button class="outline" id="importBtn">JSONを読み込む</button><input type="file" id="importFile" accept=".json,application/json" hidden></div><div class="buttons"><button class="outline" id="clearSamples">サンプル鉢を削除</button><button class="outline" id="closeSettings">閉じる</button></div></div></div>

(()=>{'use strict';const KEY='greenroom-plants-v1';const db=[
['monstera','モンステラ','🌿','bright',7,'dryTop',18,'5〜7月','強い直射日光を避ける。乾燥時は葉水を。'],['pothos','ポトス','🍃','medium',7,'dryTop',18,'5〜7月','耐陰性はあるが明るい場所ほど生育良好。過湿に注意。'],['ficus','フィカス・ウンベラータ','🌳','bright',6,'dryTop',18,'5〜7月','急な環境変化で落葉することがある。暖かい時期に施肥。'],['rubber','ゴムの木','🌳','bright',9,'dryTop',24,'5〜7月','明るい場所を好む。冬は乾かし気味。'],['snake','サンスベリア','🌵','medium',20,'dryDeep',24,'5〜8月','特に低温期の過湿は避ける。冬は水やり間隔を大きく延ばす。'],['zz','ザミオクルカス','🌿','shade',15,'dryDeep',24,'5〜8月','根茎に水を蓄える。水の与えすぎに注意。'],['spathi','スパティフィラム','🌱','medium',5,'slightlyMoist',18,'5〜7月','乾燥しすぎを避けるが、常時水浸しにはしない。'],['calathea','カラテア','🍀','medium',5,'slightlyMoist',12,'5〜7月','乾燥した空気と強光が苦手。湿度を確保。'],['maranta','マランタ','🍀','medium',5,'slightlyMoist',12,'5〜7月','直射日光を避け、適度な湿度を保つ。'],['alocasia','アロカシア','🌱','bright',5,'slightlyMoist',12,'5〜7月','高湿度を好む。寒さに注意。'],['philodendron','フィロデンドロン','🌿','bright',7,'dryTop',18,'5〜7月','明るい間接光を好む。品種により管理を調整。'],['syngonium','シンゴニウム','🍃','medium',7,'dryTop',18,'5〜7月','強い直射日光を避ける。'],['aglaonema','アグラオネマ','🍃','shade',9,'dryTop',24,'5〜7月','耐陰性が高め。冷気と過湿に注意。'],['dracaena','ドラセナ','🌴','medium',10,'dryTop',24,'5〜7月','直射日光の葉焼けと過湿に注意。'],['yucca','ユッカ','🌴','direct',12,'dryDeep',24,'5〜7月','日光を好み乾燥に強め。'],['pachira','パキラ','🌳','bright',8,'dryTop',18,'5〜7月','冬は乾かし気味に。'],['schefflera','シェフレラ','🌳','bright',8,'dryTop',24,'5〜7月','明るい場所を好むが強すぎる直射は調整。'],['areca','アレカヤシ','🌴','bright',6,'slightlyMoist',18,'5〜7月','乾燥時は葉水を。'],['kentia','ケンチャヤシ','🌴','medium',9,'dryTop',24,'5〜7月','比較的耐陰性があるが暗すぎる場所は避ける。'],['fern','ボストンファーン','🌿','medium',4,'slightlyMoist',12,'5〜7月','高湿度と明るい日陰を好む。水切れに注意。'],['ivy','アイビー','☘️','bright',6,'dryTop',18,'4〜6月','風通しを保ち、真夏の強光を避ける。'],['peperomia','ペペロミア','🍃','medium',10,'dryTop',18,'5〜7月','過湿を避ける。種類により管理が異なる。'],['pilea','ピレア','🍃','bright',7,'dryTop',12,'5〜7月','明るい間接光で育てる。'],['hoya','ホヤ','🌸','bright',12,'dryDeep',24,'5〜8月','過湿を避け、品種の特性に合わせて管理。'],['orchid','胡蝶蘭','🌸','bright',9,'dryDeep',24,'春〜初夏','水苔・バークの乾燥を見て判断。植え替えは花後など。'],['cactus','サボテン類','🌵','direct',18,'dryCompletely',24,'4〜6月','生育期と休眠期で水やりを大幅に調整。'],['s
