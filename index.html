<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#e8e8e8"><meta name="apple-mobile-web-app-capable" content="yes"><title>GREENROOM — Jungle</title><style>
:root{--bg:#e8e8e8;--ink:#242824;--muted:#727872;--line:#c9ccca;--bar:rgba(232,232,232,.96)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue", "Hiragino Kaku Gothic ProN",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #536454;outline-offset:2px}.app{height:100dvh;max-width:800px;margin:auto;overflow:hidden;position:relative}.page{position:absolute;inset:0 0 151px;overflow:auto}.jungle{overflow:hidden;touch-action:pan-x;cursor:grab}.jungle:active{cursor:grabbing}.world{position:absolute;inset:0;overflow:hidden;touch-action:pan-x}.sprite{position:absolute;border:0;background:none;padding:0;touch-action:pan-x;user-select:none;-webkit-user-select:none}.sprite img{width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none}.sprite.placeholder{opacity:.48}.sprite:focus-visible{outline:2px solid var(--ink)}.jungle-hint{position:absolute;top:calc(18px + env(safe-area-inset-top));left:20px;font-size:9px;letter-spacing:.18em;color:#777;pointer-events:none}.jungle-hint span{padding-left:8px;font-size:11px}.bottom{position:absolute;bottom:0;width:100%;z-index:60;height:151px;background:linear-gradient(to bottom,rgba(232,232,232,0),rgba(232,232,232,.94) 19%,#e8e8e8 47%);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 18px calc(7px + env(safe-area-inset-bottom))}.wander{height:43px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;margin-bottom:14px;border:0;background:transparent;color:#383b38;text-transform:lowercase;letter-spacing:.14em;font-size:12px;font-weight:400}.wander .arrow{font-size:10px;line-height:8px;color:#777}.wander.active{color:#111}.wander-panel{position:absolute;bottom:146px;left:10%;right:10%;background:#e8e8e8f5;box-shadow:0 10px 34px #00000019;z-index:65;padding:13px 12px 12px;text-align:center}.wander-panel select{width:100%;border:0;background:transparent;color:#303330;font-size:15px;padding:12px;text-align:center}.wander-panel small{color:#777;letter-spacing:.1em}.nav{width:100%;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #bfc4bf;padding-top:14px}.nav button{border:0;background:transparent;letter-spacing:.075em;color:#777;font-size:10px;padding:7px 0;text-transform:lowercase}.nav button.active{color:#171b17;font-weight:600}.brand{width:100%;display:flex;align-items:baseline;justify-content:center;gap:10px;margin-top:10px;color:#818581}.brand b{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:13px;font-weight:400;letter-spacing:.02em}.brand span{font-size:9px;letter-spacing:.12em}.utility{position:absolute;top:calc(12px + env(safe-area-inset-top));right:15px;z-index:70;display:flex;gap:8px}.tinybtn{border:1px solid #b8beb9;background:#e8e8e8d9;color:#303830;padding:8px 11px;font-size:12px}.content{padding:calc(42px + env(safe-area-inset-top)) 22px 40px}.eyebrow{font-size:10px;letter-spacing:.19em;color:#737973;text-transform:uppercase}h1{font-size:31px;font-weight:400;letter-spacing:-.04em;margin:9px 0 22px}h2{font-size:17px;font-weight:500;margin:24px 0 10px}.muted{color:var(--muted);font-size:12px;line-height:1.7}.filterrow{display:flex;gap:8px;overflow-x:auto;margin:12px 0 18px}.chip{white-space:nowrap;border:1px solid #bfc4be;background:transparent;color:#555;padding:8px 12px;font-size:11px}.chip.active{background:#303832;color:white;border-color:#303832}.search{width:100%;background:transparent;border:0;border-bottom:1px solid #b7bcb7;padding:13px 2px;outline:0;color:var(--ink)}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}.tile{text-align:left;background:transparent;border:0;padding:0 0 15px;min-width:0}.tileart{height:170px;display:flex;align-items:end;justify-content:center;overflow:hidden}.tileart img{max-width:100%;max-height:95%;object-fit:contain}.tileart .ghost{height:95px}.tile-name{font-size:13px;margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tile-note{color:#858a85;font-size:10px;margin-top:5px}.list{display:flex;flex-direction:column}.entry{display:flex;gap:13px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}.entry-illustration{width:58px;height:66px;object-fit:contain;flex-shrink:0}.entry .ghost{width:44px;height:44px}.entry-text{flex:1;min-width:0}.entry strong{font-size:13px;font-weight:500}.entry small{display:block;color:#7e827f;font-size:11px;margin-top:5px}.outline{background:transparent;border:1px solid #aab1aa;padding:8px 12px;color:#354038;font-size:11px}.solid{border:0;background:#303a32;color:white;padding:10px 13px;font-size:12px}.ghost{display:flex;align-items:center;justify-content:center;color:#819185;font-size:48px;font-family:Georgia,serif;font-weight:normal}.empty{padding:35px 8px;text-align:center;color:#7a817a;font-size:12px;line-height:2}.overlay{position:absolute;inset:0;z-index:100;background:rgba(36,43,37,.25);display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:800px;max-height:91dvh;overflow:auto;background:#f0f0f0;padding:23px 22px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 45px #0002}.sheethead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.sheethead h2{font-size:19px;margin:0;font-weight:500}.close{background:transparent;border:0;font-size:26px;color:#444;padding:0 6px}.candidate{width:100%;display:flex;gap:12px;align-items:center;padding:10px 0;border:0;border-bottom:1px solid #d2d4d2;background:transparent;text-align:left}.candidate img{width:63px;height:65px;object-fit:contain}.candidate small{display:block;color:#777;margin-top:4px}.detailart{height:230px;display:flex;justify-content:center;align-items:center}.detailart img{height:100%;max-width:100%;object-fit:contain}.detail-title{font-size:28px;font-weight:400;margin:13px 0}.meta{padding:13px 0;border-bottom:1px solid #cdd1cc;display:flex;gap:12px;justify-content:space-between;font-size:12px}.meta span:first-child{color:#777;min-width:74px}.meta span:last-child{text-align:right;white-space:pre-wrap;max-width:75%;line-height:1.6}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.field{margin:14px 0}.field label{display:block;font-size:11px;color:#676d68;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #c1c7c1;background:#fafafa;color:#273027;padding:10px;border-radius:0}.field input[type=file]{font-size:11px}.form-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.recordline{border-bottom:1px solid #c5cbc5;padding:13px 0;display:flex;justify-content:space-between;gap:12px}.recordline b{font-size:13px;font-weight:500}.recordline small{font-size:10px;color:#777}.fixed-note{font-size:11px;color:#777;line-height:1.7;margin-top:20px}.hidden{display:none!important}@media(min-width:700px){.app{box-shadow:0 0 0 1px #ddd}.tileart{height:210px}}
</style></head><body><div class="app"><div id="jungle" class="page jungle"><div class="world" id="world"></div><div class="jungle-hint">JUNGLE <span>← →</span></div></div><div id="main" class="page hidden"></div><div id="tools" class="utility"><button id="editLayout" class="tinybtn" title="植物の配置を調整">配置</button><button id="add" class="tinybtn">＋ 植物</button><button id="backup" class="tinybtn">⋯</button></div><div class="bottom"><button id="wander" class="wander" aria-label="wander 植物選択"><span class="arrow">⌃</span>wander<span class="arrow">⌄</span></button><div id="wanderPanel" class="wander-panel hidden"><small>WANDER</small><select id="wanderSelect" aria-label="植物を探す"></select><div class="muted">上下にスクロールして植物を選択</div><button class="outline" id="wanderGo" style="margin-top:9px">ジャングルで見る</button></div><div class="nav" id="nav"></div><div class="brand"><b>greenroom</b><span>v0.1</span></div></div><div id="overlay" class="overlay hidden"><div class="sheet" id="sheet"></div></div></div><script>
(()=>{'use strict';const KEY='greenroom-jungle-v1',OLD='greenroom-plants-v1';let plants=[],records=[],page='jungle',layout=false,pan=0,drag=null,urls=new Map(),db=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID?.()||Date.now()+'-'+Math.random(),date=()=>new Date().toLocaleDateString('sv-SE'),pos=(n)=>Math.round(Number(n)||0);function persist(){localStorage.setItem(KEY,JSON.stringify({plants,records}));}function openDB(){return new Promise((ok,no)=>{if(!indexedDB){no(Error('IndexedDB unavailable'));return}let req=indexedDB.open('greenroom-images-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('images');req.onsuccess=()=>ok(req.result);req.onerror=()=>no(req.error)})}function imagePut(key,blob){return new Promise((ok,no)=>{let tx=db.transaction('images','readwrite');tx.objectStore('images').put(blob,key);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})}function imageGet(key){return new Promise((ok,no)=>{let tx=db.transaction('images','readonly');let q=tx.objectStore('images').get(key);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}function imageDelete(key){return new Promise((ok,no)=>{let tx=db.transaction('images','readwrite');tx.objectStore('images').delete(key);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})}async function getURL(p,type){let key=p.id+':'+type;if(urls.has(key))return urls.get(key);let blob=await imageGet(key);if(!blob)return '';let u=URL.createObjectURL(blob);urls.set(key,u);return u}function clearURL(key){let u=urls.get(key);if(u)URL.revokeObjectURL(u);urls.delete(key)}async function renderImages(){let nodes=document.querySelectorAll('img[data-img]');await Promise.all([...nodes].map(async img=>{let [id,type]=img.dataset.img.split(':');let p=plants.find(p=>p.id===id);if(!p)return;let src=await getURL(p,type);if(!img.isConnected)return;if(src)img.src=src;else if(type==='pot'){let j=await getURL(p,'jungle');if(j)img.src=j;else img.replaceWith(ghost())}else img.replaceWith(ghost())}))}function ghost(){let g=document.createElement('div');g.className='ghost';g.textContent='✳';return g}function picture(p,type,cls=''){return `<img class="${cls}" data-img="${esc(p.id)}:${type}" alt="${esc(p.name)}" draggable="false">`}
function assign(p,side){let others=plants.filter(a=>a!==p),min=Math.min(0,...others.map(x=>x.x??0)),max=Math.max(0,...others.map(x=>x.x??0));p.x=others.length?(side==='left'?min-110:max+110):0;p.layer=p.layer??(1+Math.floor(Math.random()*5));p.y=p.y??([-3,22,49,74,92][p.layer-1]);p.w=p.w||190;p.h=p.h||260}function load(){try{let saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.plants)){plants=saved.plants;records=Array.isArray(saved.records)?saved.records:[];return}}catch{}try{let old=JSON.parse(localStorage.getItem(OLD));if(Array.isArray(old)){plants=old.map((p,i)=>({id:p.id||uid(),name:p.name||'植物',species:p.species||'',location:p.location||'',light:p.light||'',waterDays:p.waterDays||7,waterMethod:p.waterMethod||'',lastWater:p.lastWater||'',lastRepot:p.lastRepot||'',repotSeason:p.repotSeason||'',notes:p.notes||'',layer:1+i%5,x:(i%2?1:-1)*Math.ceil(i/2)*110,y:[-3,22,49,74,92][i%5],w:190,h:260,legacyPhoto:p.photo||'',log:p.log||[]}));records=plants.flatMap(p=>(p.log||[]).map(l=>({id:uid(),plantId:p.id,type:l.type,date:l.date})));persist();return}}catch{}plants=[];records=[];persist()}
function sorted(){return [...plants].sort((a,b)=>(a.layer||3)-(b.layer||3)||a.x-b.x)}let viewportW=0;function renderJungle(){let world=$('#world');viewportW=$('#jungle').clientWidth;world.innerHTML='';const viewHeight=$('#jungle').clientHeight,base=Math.max(140,viewHeight*.85);for(let p of sorted()){let x=viewportW/2+p.x+pan,w=p.w||190,h=p.h||260;if(x+w/2 < -120 || x-w/2>viewportW+120)continue;let sprite=document.createElement('button');sprite.className='sprite';sprite.dataset.id=p.id;sprite.setAttribute('aria-label',p.name);sprite.style.cssText=`left:${Math.round(x-w/2)}px;top:${Math.round(base-h+(p.y||0))}px;width:${w}px;height:${h}px;z-index:${p.layer||3}`;sprite.innerHTML=picture(p,'jungle');world.append(sprite)}renderImages();}
function nav(){let labels=['jungle','my plants','care','record'];$('#nav').innerHTML=labels.map(n=>`<button data-page="${n}" class="${page===n?'active':''}">${n}</button>`).join('');$('#wander').classList.toggle('hidden',page!=='jungle');$('#editLayout').classList.toggle('hidden',page!=='jungle');$('#jungle').classList.toggle('hidden',page!=='jungle');$('#main').classList.toggle('hidden',page==='jungle');$('#editLayout').textContent=layout?'完了':'配置'}function setPage(n){page=n;layout=false;$('#wanderPanel').classList.add('hidden');nav();render()}function render(){nav();if(page==='jungle')renderJungle();else if(page==='my plants')renderMy();else if(page==='care')renderCare();else renderRecord();refreshWander()}
function renderMy(){let m=$('#main');m.innerHTML=`<div class="content"><div class="eyebrow">YOUR LIVING PLANTS</div><h1>My Plants <span class="muted">${plants.length}</span></h1><input id="q" class="search" placeholder="植物名・品種・場所で探す" aria-label="植物検索"><div class="filterrow" id="filters"><button class="chip active" data-filter="all">すべて</button><button class="chip" data-filter="water">土の確認</button><button class="chip" data-filter="repot">植え替え</button></div><div class="gallery" id="gallery"></div></div>`;let filter='all';function list(){let q=$('#q').value.toLowerCase();let found=plants.filter(p=>(p.name+' '+p.species+' '+p.location).toLowerCase().includes(q)&&(filter==='all'||filter==='water'&&dueWater(p)||filter==='repot'&&dueRepot(p)));$('#gallery').innerHTML=found.map(p=>`<button class="tile" data-detail="${esc(p.id)}"><div class="tileart">${picture(p,'pot')}</div><div class="tile-name">${esc(p.name)}</div><div class="tile-note">${esc(p.location||'場所未設定')}</div></button>`).join('')||'<div class="empty">植物が見つかりません</div>';renderImages()}$('#q').oninput=list;$('#filters').onclick=e=>{let b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;$('#filters').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));list()};list()}
function days(s){if(!s)return null;let a=new Date(s+'T12:00:00');return Number.isFinite(a.valueOf())?Math.floor((new Date(date()+'T12:00:00')-a)/86400000):null}function dueWater(p){let d=days(p.lastWater);return d===null||d>=Number(p.waterDays||7)}function dueRepot(p){return p.lastRepot&&days(p.lastRepot)>=(365*1.5)}function renderCare(){let water=plants.filter(dueWater),repot=plants.filter(dueRepot);$('#main').innerHTML=`<div class="content"><div class="eyebrow">TODAY & NEXT</div><h1>Care</h1><p class="muted">水やりは日数だけで判断せず、土の乾き具合を確認してください。</p><h2>土の確認 <span class="muted">${water.length}</span></h2><div class="list">${water.map(p=>`<div class="entry">${picture(p,'pot','entry-illustration')}<div class="entry-text"><strong>${esc(p.name)}</strong><small>${p.lastWater?'前回の水やり '+esc(p.lastWater):'水やり未記録'}</small></div><button class="outline" data-care="${esc(p.id)}">確認</button></div>`).join('')||'<p class="muted">確認対象はありません。</p>'}</div><h2>植え替えの確認 <span class="muted">${repot.length}</span></h2><div class="list">${repot.map(p=>`<div class="entry">${picture(p,'pot','entry-illustration')}<div class="entry-text"><strong>${esc(p.name)}</strong><small>植え替えの時期を確認</small></div><button class="outline" data-care="${esc(p.id)}">確認</button></div>`).join('')||'<p class="muted">確認対象はありません。</p>'}</div></div>`;renderImages()}
function renderRecord(){let entries=records.slice().sort((a,b)=>b.date.localeCompare(a.date));$('#main').innerHTML=`<div class="content"><div class="eyebrow">THE LIVING ARCHIVE</div><h1>Record</h1>${entries.map(r=>{let p=plants.find(p=>p.id===r.plantId);return `<div class="recordline"><div><b>${esc(p?.name||'削除された植物')}</b><br><small>${esc(({water:'水やり',check:'土の確認',repot:'植え替え',fertilize:'施肥'})[r.type]||r.type)}${r.memo?' · '+esc(r.memo):''}</small></div><small>${esc(r.date)}</small></div>`}).join('')||'<div class="empty">お世話の記録はまだありません</div>'}</div>`}
function sheet(html){$('#sheet').innerHTML=html;$('#overlay').classList.remove('hidden');renderImages()}function close(){ $('#overlay').classList.add('hidden') }function detail(id){let p=plants.find(p=>p.id===id);if(!p)return;sheet(`<div class="sheethead"><span class="eyebrow">PLANT DETAIL</span><button class="close" data-close>×</button></div><div class="detailart">${picture(p,'pot')}</div><h2 class="detail-title">${esc(p.name)}</h2><div class="muted">${esc(p.species||'')} · ${esc(p.location||'場所未設定')}</div><h2>Growing conditions</h2>${[['日照',p.light],['水やりの目安',p.waterDays?p.waterDays+'日ごとに土を確認':'未設定'],['水やり方法',p.waterMethod],['植え替えの目安',p.repotSeason],['前回の水やり',p.lastWater],['前回の植え替え',p.lastRepot],['特徴・注意事項',p.notes]].map(a=>`<div class="meta"><span>${a[0]}</span><span>${esc(a[1]||'未登録')}</span></div>`).join('')}<h2>Recent records</h2>${records.filter(r=>r.plantId===id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6).map(r=>`<div class="recordline"><b>${esc(r.type==='water'?'水やり':r.type==='check'?'土の確認':r.type==='repot'?'植え替え':'施肥')}</b><small>${esc(r.date)}</small></div>`).join('')||'<p class="muted">記録はまだありません。</p>'}<div class="actions"><button class="solid" data-care="${esc(id)}">お世話を記録</button><button class="outline" data-edit="${esc(id)}">編集・画像登録</button><button class="outline" data-find="${esc(id)}">ジャングルで見る</button></div>`)}
function care(id){let p=plants.find(p=>p.id===id);if(!p)return;sheet(`<div class="sheethead"><h2>${esc(p.name)}</h2><button class="close" data-close>×</button></div><p class="muted">実施した内容のみ記録してください。</p><form id="careForm"><div class="field"><label>お世話の種類</label><select name="type"><option value="water">水やり</option><option value="check">土の確認（水やりなし）</option><option value="repot">植え替え</option><option value="fertilize">施肥</option></select></div><div class="field"><label>実施日</label><input name="date" type="date" required value="${date()}"></div><div class="field"><label>メモ（任意）</label><textarea name="memo" rows="2"></textarea></div><button class="solid">記録する</button></form>`);$('#careForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),type=f.get('type'),dt=f.get('date');records.push({id:uid(),plantId:id,type,date:dt,memo:f.get('memo')});if(type==='water')p.lastWater=dt;if(type==='repot')p.lastRepot=dt;persist();close();render()}}
function form(id){let p=plants.find(p=>p.id===id),editing=!!p;p=p||{name:'',species:'',location:'',light:'',waterDays:7,waterMethod:'',repotSeason:'',lastWater:'',lastRepot:'',notes:'',layer:3,w:190,h:260};sheet(`<div class="sheethead"><h2>${editing?'植物の編集':'植物を登録'}</h2><button class="close" data-close>×</button></div><form id="plantForm"><div class="field"><label>植物の名前</label><input name="name" required maxlength="100" value="${esc(p.name)}"></div><div class="field"><label>品種・学名</label><input name="species" value="${esc(p.species)}"></div><div class="field"><label>置き場所</label><input name="location" value="${esc(p.location)}"></div><div class="field"><label>JUNGLEイラスト（鉢なし／透過PNG・WebP推奨）</label><input name="jungle" type="file" accept="image/png,image/webp,image/jpeg"></div><div class="field"><label>MY PLANTS・DETAIL（鉢あり）</label><input name="pot" type="file" accept="image/png,image/webp,image/jpeg"></div><div class="field"><label>日照条件</label><input name="light" value="${esc(p.light)}" placeholder="明るい間接光"></div><div class="field"><label>土の確認間隔（日）</label><input name="waterDays" type="number" min="1" max="365" value="${Number(p.waterDays)||7}"></div><div class="field"><label>水やり方法</label><textarea name="waterMethod" rows="2">${esc(p.waterMethod)}</textarea></div><div class="field"><label>植え替え適期</label><input name="repotSeason" value="${esc(p.repotSeason)}"></div><div class="field"><label>特徴・育成条件・注意事項</label><textarea name="notes" rows="5">${esc(p.notes)}</textarea></div><div class="field"><label>JUNGLEレイヤー（1=最奥 / 5=最前景）</label><select name="layer">${[1,2,3,4,5].map(n=>`<option ${p.layer==n?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>JUNGLE画像の幅 (px)</label><input name="w" type="number" min="50" max="700" value="${p.w||190}"></div><div class="form-actions"><button class="solid">${editing?'変更を保存':'植物を追加'}</button>${editing?'<button type="button" class="outline" id="deletePlant">植物を削除</button>':''}</div><p class="fixed-note">画像はこの端末のブラウザ内に保存します。別端末との同期はありません。</p></form>`);$('#plantForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),newId=id||uid();let target=plants.find(x=>x.id===newId)||{id:newId};let updates={name:String(f.get('name')).trim(),species:String(f.get('species')),location:String(f.get('location')),light:String(f.get('light')),waterDays:Number(f.get('waterDays'))||7,waterMethod:String(f.get('waterMethod')),repotSeason:String(f.get('repotSeason')),notes:String(f.get('notes')),layer:Number(f.get('layer')),w:Number(f.get('w'))||190};if(!updates.name)return;Object.assign(target,updates);target.h=target.h||260;if(!id){assign(target,Math.random()<.5?'left':'right');plants.push(target)}try{for(let typ of ['jungle','pot']){let file=f.get(typ);if(file instanceof File&&file.size){if(file.size>12*1024*1024)throw Error('画像は12MB以下にしてください');await imagePut(newId+':'+typ,file);clearURL(newId+':'+typ)}}persist();close();render();if(page==='jungle')focus(target.id)}catch(err){alert('画像の保存に失敗しました: '+err.message)}};if(editing)$('#deletePlant').onclick=async()=>{if(!confirm('この植物と関連する記録を削除しますか？'))return;plants=plants.filter(x=>x.id!==id);records=records.filter(r=>r.plantId!==id);for(let type of ['jungle','pot']){await imageDelete(id+':'+type);clearURL(id+':'+type)}persist();close();render()}}
function refreshWander(){let s=$('#wanderSelect');s.innerHTML=plants.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}
function focus(id){let p=plants.find(p=>p.id===id);if(!p)return;setPage('jungle');pan=-p.x;renderJungle();let node=[...document.querySelectorAll('.sprite')].find(n=>n.dataset.id===id);if(node){node.style.filter='brightness(1.12)';setTimeout(()=>{if(node.isConnected)node.style.filter=''},900)}}
function pickCandidates(x,y){let j=$('#jungle'),r=j.getBoundingClientRect();let localX=x-r.left,localY=y-r.top;let base=Math.max(140,j.clientHeight*.85);return sorted().filter(p=>{let sx=viewportW/2+p.x+pan-(p.w||190)/2,sy=base-(p.h||260)+(p.y||0);return localX>=sx&&localX<=sx+(p.w||190)&&localY>=sy&&localY<=sy+(p.h||260)}).reverse()}function choose(candidates){if(!candidates.length)return;if(candidates.length===1){detail(candidates[0].id);return}sheet(`<div class="sheethead"><h2>植物を選ぶ</h2><button class="close" data-close>×</button></div><div class="muted">重なっている${candidates.length}鉢から選択</div>${candidates.map(p=>`<button class="candidate" data-detail="${esc(p.id)}">${picture(p,'pot')}<span>${esc(p.name)}<small>${esc(p.location||'')} · layer ${p.layer}</small></span></button>`).join('')}`)}
function layoutPanel(){sheet(`<div class="sheethead"><h2>JUNGLEの配置</h2><button class="close" data-close>×</button></div><p class="muted">配置モードでは植物をドラッグして左右・上下に動かせます。重なりはレイヤーで調整します。完了で通常操作に戻ります。</p><div class="list">${plants.map(p=>`<div class="entry"><div class="entry-text"><strong>${esc(p.name)}</strong><small>layer ${p.layer} / x ${pos(p.x)} / y ${pos(p.y)}</small></div><button class="outline" data-edit="${esc(p.id)}">設定</button></div>`).join('')}</div>`)}
function download(name,blob){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}async function settings(){sheet(`<div class="sheethead"><h2>バックアップ</h2><button class="close" data-close>×</button></div><p class="muted">植物データ・記録・登録画像を1つのJSONファイルに書き出します。容量が大きくなる場合があります。</p><div class="actions"><button class="solid" id="export">バックアップを書き出す</button><button class="outline" id="import">バックアップを読み込む</button><input id="importFile" type="file" accept="application/json" class="hidden"></div>`);$('#export').onclick=async()=>{try{let out={app:'GREENROOM-JUNGLE',version:1,plants,records,images:{}};for(let p of plants)for(let typ of ['jungle','pot']){let blob=await imageGet(p.id+':'+typ);if(blob){let data=await new Promise(ok=>{let reader=new FileReader();reader.onload=()=>ok(reader.result);reader.readAsDataURL(blob)});out.images[p.id+':'+typ]=data}}download('greenroom-jungle-backup-'+date()+'.json',new Blob([JSON.stringify(out)],{type:'application/json'}))}catch(e){alert('書き出しに失敗しました: '+e.message)}};$('#import').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{let json=JSON.parse(await e.target.files[0].text());if(json.app!=='GREENROOM-JUNGLE'||!Array.isArray(json.plants)||json.plants.length>1000||!Array.isArray(json.records)||typeof json.images!=='object'||!json.plants.every(p=>p&&typeof p.id==='string'&&typeof p.name==='string'))throw Error('形式が違います');if(!confirm('現在の全データを置き換えますか？'))return;for(let p of plants)for(let typ of ['jungle','pot']){await imageDelete(p.id+':'+typ);clearURL(p.id+':'+typ)}for(let [k,v] of Object.entries(json.images)){if(!/^.+:(jungle|pot)$/.test(k)||typeof v!=='string'||!v.startsWith('data:image/'))continue;let b=await(await fetch(v)).blob();await imagePut(k,b)}plants=json.plants;records=json.records;persist();close();render()}catch(err){alert('読み込みに失敗しました: '+err.message)}}}
$('#nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)};$('#add').onclick=()=>form();$('#backup').onclick=settings;$('#editLayout').onclick=()=>{layout=!layout;nav();if(layout)layoutPanel()};$('#wander').onclick=()=>{$('#wanderPanel').classList.toggle('hidden');$('#wander').classList.toggle('active',!$('#wanderPanel').classList.contains('hidden'))};$('#wanderGo').onclick=()=>{let id=$('#wanderSelect').value;$('#wanderPanel').classList.add('hidden');focus(id)};$('#overlay').onclick=e=>{if(e.target===$('#overlay'))close();let a=e.target.closest('[data-close],[data-detail],[data-care],[data-edit],[data-find]');if(!a)return;if(a.hasAttribute('data-close'))close();else if(a.dataset.detail)detail(a.dataset.detail);else if(a.dataset.care)care(a.dataset.care);else if(a.dataset.edit)form(a.dataset.edit);else if(a.dataset.find){close();focus(a.dataset.find)}};$('#main').onclick=e=>{let a=e.target.closest('[data-detail],[data-care]');if(!a)return;if(a.dataset.detail)detail(a.dataset.detail);if(a.dataset.care)care(a.dataset.care)};
$('#jungle').addEventListener('pointerdown',e=>{drag={id:null,x:e.clientX,y:e.clientY,startPan:pan,moved:false};if(layout){let t=e.target.closest('.sprite');if(t){drag.id=t.dataset.id;let p=plants.find(p=>p.id===drag.id);drag.startX=p.x;drag.startY=p.y}}$('#jungle').setPointerCapture(e.pointerId)});$('#jungle').addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>6)drag.moved=true;if(drag.id){let p=plants.find(p=>p.id===drag.id);p.x=Math.round(drag.startX+dx);p.y=Math.round(drag.startY+dy)}else pan=Math.round(drag.startPan+dx);renderJungle()});$('#jungle').addEventListener('pointerup',e=>{if(!drag)return;let old=drag;drag=null;if(old.id&&old.moved){persist();return}if(!old.moved&&!layout){let found=pickCandidates(e.clientX,e.clientY);choose(found)}});$('#jungle').addEventListener('pointercancel',()=>{drag=null});window.addEventListener('resize',()=>{if(page==='jungle')renderJungle()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});async function init(){try{db=await openDB()}catch(e){alert('このブラウザでは画像保存が利用できません。Safariの通常モードでお試しください。');return}load();nav();render()}init();})();
</script></body></html>
